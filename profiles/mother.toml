[rom]
name = "mother"
mapper = 4
prg_kib = 256
chr_kib = 128

[vectors]
nmi = 0xF892
reset = 0xFF40
irq = 0xFE7B

[input]
mode = "action"
pause_start = true

# Dynamically-reached fixed code (no static refs, found via dispatch-miss
# $CB1B/$CB1C harvest): $CA89 is a JMP ($007C) transfer target (transfer
# loop reached every ~7k steps). Rooted so dispatch hits exactly instead
# of realigning/walking.

[[function]]
addr = 0xCA89
name = "XferCA89"

# Indirect-transfer hot entry (every frame via JMP ($007C)): $FA38 is
# task-8's streaming-loop interior (INY; LDX $0400,Y; ...). No static refs
# (data-driven pointer); without a record every dispatch misses. Rooted so
# dispatch hits exactly (overlaps NmiTask8's walk — same bytes, entry label
# added for the record).

[[function]]
addr = 0xFA38
name = "Task8Loop"

# NMI task vector table at $F99F (10 entries, dispatched via
# LDA $F9A0,X / LDA $F99F,X + PHA/PHA/RTS). The table stores `target-1`
# (the classic 6502 RTS-dispatch idiom: RTS pops the pushed word and then
# increments PC), so the root must be the EFFECTIVE entry `word+1`, not the
# raw word. Rooting the raw word put no dispatch-table record at the address
# the runtime requests; rt_banked_tail_dispatch then took its misaligned-
# return realignment path and jumped to the NEXT lifted boundary, so a
# type-4 palette flush ran task 5's body instead. Byte-verified: every raw
# word is the high byte of the preceding `JMP $F8BD` (or the last table
# byte), and `word+1` is the first real instruction (INY / LDA / JSR).
# Table ends at task 9 ($FA57 -> $FA58); task 10+ decode as garbage.

[[function]]
addr = 0xF8BD
name = "NmiTask0"

[[function]]
addr = 0xF9B3
name = "NmiTask1"

[[function]]
addr = 0xF9B7
name = "NmiTask2"

[[function]]
addr = 0xF9C1
name = "NmiTask3"

[[function]]
addr = 0xF9C9
name = "NmiTask4"

[[function]]
addr = 0xF9F2
name = "NmiTask5"

[[function]]
addr = 0xF9FF
name = "NmiTask6"

[[function]]
addr = 0xFA18
name = "NmiTask7"

[[function]]
addr = 0xFA58
name = "NmiTask9"

# (Deadlock-diagnostic stubs REMOVED 2026-09-08: testing faithful boot with
# DIAG_DELAYNMI head-start instead. Re-add only if faithful path deadlocks.)

# Fixed->window call edges verified by the reference harvest (each ran with
# the bound bank live): $8000 under bank 28, $9400 under bank 20 (LOW), and
# the cross-window $BF62 under bank 19 (called from bank-20 LOW code while
# HIGH holds 19). One bank per target is enforced by profile validation;
# unannotated window calls trap via rt_unresolved_jsr (fail closed).

[[bank_call]]
target = 0x8000
bank = 28

# $FDAD: JMP $8006 (one-shot reset tail; executes during NMI-disabled
# pre-roll, hence absent from frame-loop harvests). Subject watch shows
# R6 <- $1C immediately before the jump; b28 $8006 = JMP $81F5 init
# trampoline while all other banks hold data there. Single static edge
# (no JSR $8006 anywhere in PRG).

[[bank_call]]
target = 0x8006
bank = 28

[[bank_call]]
target = 0x9400
bank = 20

[[bank_call]]
target = 0xbf62
bank = 19

# Session-2 run-A fixed->window call edges (see the run-A header on the
# [[bank_entry]] group at the end of this file for provenance): each target
# was observed live under exactly one bank across the 120k-frame harvest
# (bank8=19 for the b19 HIGH entries, bank8=20 for $952B), and each now has
# a matching [[bank_entry]]. Static callers run in fixed code
# ($CC6F/$CCB0/$CCD0/$CCD6/$CCD9/$F30C -> $A0xx/$BDD3; $F313 -> $952B) and
# in bank-19 LOW ($L_b19_8D54 -> $ABF6); without these bindings the
# unprefixed cross-window refs stay unresolved and trap (fail closed).
# $963D $9786 $97B0 $A3F8 $A92F $AB09 $BC73 $BCAA were never executed in any
# harvest — their banks are unknown, so they are deliberately NOT bound.

[[bank_call]]
target = 0x952b
bank = 20

[[bank_call]]
target = 0xa000
bank = 19

[[bank_call]]
target = 0xa123
bank = 19

[[bank_call]]
target = 0xa178
bank = 19

[[bank_call]]
target = 0xa1b6
bank = 19

[[bank_call]]
target = 0xabf6
bank = 19

[[bank_call]]
target = 0xbdd3
bank = 19

# $9BD0 ends with `JSR $F3C5` (JumpEngine dispatch helper) followed by an
# inline 3-entry pointer table. The table bytes `0D 9C | 11 9C | 15 9C`
# decode as `ORA $119C` / `SHY $9C15,X` when walked linearly — the SHY at
# $9C0A is jump-table DATA (the high byte of the $9C11 pointer), never
# executed. The dispatcher (ASL A / TAY / INY / PLA/PLA -> ($60),Y) reads
# the table indexed by A (LDA $57 at $9C02) and RTS-dispatches to $9C0D /
# $9C11 / $9C15, which set X and converge on $9C17 (`JSR $FE6F; STX $7418;
# JMP $FE75`). Bound as a [[jump_engine]] so the walker stops at the table
# and the targets root as bank-20 entries instead of tripping fail-closed.

[[jump_engine]]
caller = 0x9C04
bank = 20
targets = ["L_b20_9C0D", "L_b20_9C11", "L_b20_9C15"]

# MMC3 window seeds — ground truth from the reference harvest, never
# invented. Run 1: FD_LOG_BANK_ENTRIES=1 frame-diff --ref-only, 600 frames,
# script=none (boot -> title screen, no input). Run 2 (strict superset of
# run 1: all 34 run-1 seeds re-observed): FD_PAUSE_START=1 (Mother's RAM
# never sets SMB's $0770 title flag, so without it script "start" arrives
# as NES B), 2400 frames with buttons-script pressing START past the title
# plus dpad/SELECT; reference PPMs show title (f299) -> menu (f1500+).
# Byte-spot-checks decode as code (b28 $8000 = JMP $827D trampoline;
# b20 $9400 = JSR $CFB3 back into fixed; b19 $BF62 = JSR $BF95 with four
# static JSR $BF62 callers in b20-LOW at $948C/$94C2/$94D5/$94F2).
# A first probe misread HIGH-window bytes with LOW-window offsets and
# briefly flagged $BF95/$BFA4/$BFAD as data; re-read at the correct
# (addr-$A000) offsets they are code (AND #$07, LDA #$00, JSR $BFA4).
# Run 3 (strict superset: all 48 run-2 seeds re-observed): new FD_PAD_BOTH
# knob (face bits drive A+Select / B+Start together — Mother's RAM never
# sets SMB's $0770 title flag, so the title/gameplay split can never yield
# both START and A otherwise), 3600 frames with START+A+dpad script;
# reference PPMs show title -> menu -> Japanese dialogue textbox (A taps
# advance text). +16 seeds, all byte-checked as code with static callers
# (b28 $8662 has 10 static JMP/JSR callers — shared vector-table routine).

[[bank_entry]]
bank = 28
addr = 0x8000

