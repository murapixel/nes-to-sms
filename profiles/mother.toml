# $9BD0 ends with `JSR $F3C5` (JumpEngine dispatch helper) followed by an
# inline 3-entry pointer table. The table bytes `0D 9C | 11 9C | 15 9C`
# decode as `ORA $119C` / `SHY $9C15,X` when walked linearly — the SHY at
# $9C0A is jump-table DATA (the high byte of the $9C11 pointer), never
# executed. The dispatcher (ASL A / TAY / INY / PLA/PLA -> ($60),Y) reads
# the table indexed by A (LDA $57 at $9C02) and RTS-dispatches to $9C0D /
# $9C11 / $9C15, which set X and converge on $9C17 (`JSR $FE6F; STX $7418;
# JMP $FE75`). Bound as a [[jump_engine]] so the walker stops at the table
# and the targets root as bank-20 entries instead of tripping fail-closed.
# Scratch-bypass note (trap-triage 2026-09-23, walk4 route frame 3229): the
# lowered compare-chain jumps straight to the targets and SKIPS the helper
# body, so the reference's PLA/PLA side effect ($60/$61 <- inline-data
# pointer; ref $06/$9C at 3229) never happens on the subject (stale $00/$80).
# This is a KNOWN, HARMLESS transient, not a miscompile to fix by executing
# the helper (that would walk inline table bytes as code): $FE6F/$FE75 (two
# STA $A001 + RTS) never read $60/$61, nothing in the 3229-3258 window reads
# the stale bytes (no cascade), and the next $60 writer realigns both sides
# (both $D2 at frame 3259; lockstep fully clean 3259-3500). Same-signature
# future divergences (2 bytes, $60/$61-class scratch, self-healing <64f)
# should be triaged as bypass transients first.

[[jump_engine]]
caller = 0x9C04
bank = 20
targets = ["L_b20_9C0D", "L_b20_9C11", "L_b20_9C15"]

