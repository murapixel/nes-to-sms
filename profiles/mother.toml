[rom]
name = "mother"
mapper = 4
prg_kib = 256
chr_kib = 128

[vectors]
nmi = 0xF892
reset = 0xFF40
irq = 0xFE7B

[input]
mode = "action"
pause_start = true

# Input ground truth (trap-triage 2026-09-23, walk4 route ref-only traces):
# Mother's NMI sampler at $FEB3 bit-REVERSES the pad byte. Each $4016 bit is
# LSR'd into carry and ROL'd into $C0/$C1, so the first-read bit (A) ends up
# at bit 7, not bit 0. Game-space masks (as the waits below test them):
#   A=$80 B=$40 Select=$20 Start=$10 Up=$08 Down=$04 Left=$02 Right=$01.
# Do NOT "fix" masks that look shifted (e.g. the title wait's AND #$10 IS
# Start, and the bank-30 menu's AND #$C0 IS A/B) -- the oracle returns real
# hardware serial bits (0x40|bit) and both sides agree bit-exactly.
# Button-wait inventory (all advance on delivered edges; none is timer-gated):
#   title $9EA0 loop (AND #$10 = START, exits frame 1100 on Start),
#   name-reg $F09C any-key wait ($DA nonzero; every A/B/Start press exits and
#     re-enters within ~1-36 frames through the whole 1222-4988 name-reg),
#   intro-story $F390 A/B wait (AND #$C0; pages turn on A@5200/5400/...),
#   bank-30 $CCB0 loop (LDY $DA + AND #$C0: A->$A178 / B->$A000 / else $A123).
# The $943B RTS-dispatch (table $944D) is a ONE-SHOT: it runs exactly once
# (frame 1500, Y=$82=1, selector 4 -> arm $9457), so "$9457 fires only once"
# is by design, not a stall. The $E0/$E1 NMI frame timer ($F947-$F965) ticks
# normally on both sides (E0 re-arm $F8BB / expire->FD22 observed ref 5689x
# per 8000 frames; subject executes the same translated path with identical
# values). Harvests that look "stuck in the intro dialogue" are routes with
# no further inputs: the game correctly parks in $F09C awaiting the next key.
# Route-authoring note: the subject delivers pause-Start as a 4-frame tap
# ($CB2E countdown, runtime/input.s + frame-diff pause injector) while pad
# scripts model human holds (walk4.txt holds Start 30 frames). Each Start
# press therefore diverges $C0/$DE for 26 frames post-tap (1104-1129 etc.;
# 156 frames over six presses on walk4@3500) and self-heals on release.
# walk4_4f.txt (4-frame Start holds) is duration-matched and fully clean
# through the same region -- use it when a zero-transient baseline is needed.
# A-press parity is exact (full 30-frame holds both sides).
# --buttons-script is INVALID for Mother lockstep (trap-triage 2026-09-25):
# the script's SMS-$DC encoding round-trips asymmetrically. Ref decodes with
# OperMode forced to title (FD_PAUSE_START), so "a"->SELECT and "start"->START;
# the subject runtime decodes with the live OperMode ($99, gameplay), so
# "a"->A but "start"->B plus the pause-tap Start ($C0=$50 vs $10 at frame
# 1100), derailing the menu branch at the very next A-press (frame 1500:
# $0026/$0031 OAM/text state fork; sprites compared off-route are meaningless).
# FD_PAD_RAW (raw NES buttons + FD_PAUSE_AT) is the only valid stimulus:
# 2600-frame naming lockstep is exact except the documented 104-frame
# Start-hold-vs-tap pad transient ($00C0/$00DE only). Never compare visuals
# across a buttons-script run.

# Static WRAM code blob (see the WRAM-code blocker grounding at the
# overworld bank-entry block, $951A JSR $6047). Mother copies 3 KiB from
# CHR ROM offset $1E800 to WRAM $6000-$6BFF at the title->game transition
# and executes it. 11 reference-grounded entry points (FD_TRACE_PC
# bank=255 at frames 1105-1121, byte-identical at frames 1200/2000,
# plus $607B at frame 1500 - see below).
# The engine lifts these from the blob bytes; JSRs into $6000-$7FFF
# dispatch to the translated routines.
# $607B (11th entry): frame-1500 'A'-cascade grounding. The bank-20
# RTS-dispatch at $943B (table $944D, X=8 from ($0584)+1=$0585=$84 ASL
# -> $08) takes arm $9457, whose prologue does JSR $607B at $9463
# (FD_TRACE_PC frame=1500 bank=255 pc=$607B/$6082/$6097, stack return
# $9465). Byte-verified bounds: RTS at $607A, entry PHA at $607B, clean
# walk to RTS at $60AC (branches at $6095/$609C/$60A3 all internal, no
# JSR/JMP/BRK). Routine copies PRG ROM ($32)=$BE00 -> SRAM ($30)=$7400
# (2 pages + clear) and sets $7402 flags; ref writes $31=$74->$76 and
# $33=$BE->$C0. Without it the JSR lowers to rt_unresolved_jsr_flash.
[[wram_blob]]
source = 0x1E800
dest = 0x6000
length = 0xC00
entries = [0x6000, 0x6047, 0x6052, 0x605D, 0x607B, 0x62AD, 0x62D8, 0x62ED, 0x6303, 0x631D, 0x6332]

# Dynamically-reached fixed code (no static refs, found via dispatch-miss
# $CB1B/$CB1C harvest): $CA89 is a JMP ($007C) transfer target (transfer
# loop reached every ~7k steps). Rooted so dispatch hits exactly instead
# of realigning/walking.

[[function]]
addr = 0xCA89
name = "XferCA89"

# Second JMP ($007C) transfer target in the same $C9B5 transfer loop. That
# routine sets the pointer explicitly at $C9D2-$C9D8 (`LDY #$C7; STY $7C;
# LDY #$C9; STY $7D`), then `JMP $CA19`; the loop later does `JMP ($007C)`
# and must re-enter at $C9C7. Rooted because $C9C7 is the JSR $CBBD return
# continuation at $C9C4 (also reached as a routine-interior label), so the
# analyzer never made it a dispatch-table record. Without it the runtime's
# _btd_miss next-boundary realignment silently lands on the next lifted
# boundary $C9E5 (`DEC $77`) and runs the sibling routine. Byte-verified:
# $C9C7 = C6 7F (DEC $7F); reference FD_TRACE_PC frame=32 bank=30 pc=$CAAC
# -> pc=$C9C7. Overlaps the $C9B5 walk — same bytes, entry label only.

[[function]]
addr = 0xC9C7
name = "XferC9C7"

# Third JMP ($007C) transfer-loop head in the same $C9B5/$C9E5 engine:
# $C9F9 is the JSR $CBBD return continuation at $C9F6 (same pattern as
# $C9C7 after the JSR $CBBD at $C9C4), so the analyzer never made it a
# dispatch-table record. Every JMP ($007C) with ($007C)=$C9F9 (pointer
# set at $CA06-$CA0C) therefore missed and _btd_miss realigned forward
# to the next fixed-bank entry >= $C9F9, which is $CA19: STA $72 ran
# with the arm's stale accumulator (frame-1206: A=$1C residue after the
# $CAAF $CAC0 loop) instead of the transfer byte, and the out-of-table
# RTS read $CA5E/$CA5F=$A400 -> target $A401 -> $E2 miss trap
# (id=$A401). Byte-verified: $C9F9 = C6 7F (DEC $7F); reference
# FD_TRACE_PC frame=1206 bank=30 pc=$CAAC -> JMP ($007C); subject
# FD_TRACE_PC_SUBJ frame=1206 pc=$7768 ($CACD) -> pc=$7126 (L_CA19)
# with A=$1C and no $C9F9-loop dispatch in between. Overlaps the $C9E5
# walk — same bytes, entry label only. No bank numbers invented:
# fixed $C000-$DFFF window (bank 30), same as its $C9C7 sibling.

[[function]]
addr = 0xC9F9
name = "XferC9F9"

# $CA19 is an inline RTS jump-table dispatcher (not a profiled
# [[jump_engine]]: its table is not laid out at JSR caller+3):
#   $CA19: STA $72; ASL A; TAY
#   $CA1D: LDA $CA27,Y; PHA   ; high byte first
#   $CA21: LDA $CA26,Y; PHA   ; low byte last
#   $CA25: RTS                ; pops word, +1 -> effective target
# The table ($CA26 low / $CA27 high, 10 entries) yields, per word+1:
#   A=0..3 -> $CA50   A=4 -> $CA89   A=5 -> $CA3A   A=6 -> $CAAF
#   A=7 -> $CAD0      A=8 -> $CA77   A=9 -> $CB52
# Every arm is fixed $C000-$FFFF code (dispatch record NES bank $FF) and
# every arm was byte-disassembled as a clean instruction boundary:
# $CA50 = 68 (PLA), the rest start A4 7A (LDY $7A). Only $CA89 had a
# static record; the other arms are reached solely through
# rt_rts_dispatch, so _btd_miss realigned the frame-32 A=1 dispatch to
# the next lifted fixed boundary $CA89 and silently ran the A=4 arm
# (subject diverged at NES $CA8B, STA $76). Reference harvest evidence
# (40 frames, mother_input12.txt, FD_TRACE_PC): $CA50 at frame 32 (the
# first divergence) and again frames 33-35; $CAAF at frame 33. The
# remaining arms were not observed in this window but are rooted anyway
# so a later A=5/7/8/9 dispatch cannot silently realign onto a sibling
# arm instead of trapping (rooting only the observed two would make
# $CA3A/$CA77 realign to the freshly-rooted $CA50, a silent wrong-code
# jump). No bank numbers invented: all six are fixed-bank arms of the
# same byte-verified table.

[[function]]
addr = 0xCA3A
name = "XferCA3A"

[[function]]
addr = 0xCA50
name = "XferCA50"

[[function]]
addr = 0xCA77
name = "XferCA77"

[[function]]
addr = 0xCAAF
name = "XferCAAF"

[[function]]
addr = 0xCAD0
name = "XferCAD0"

[[function]]
addr = 0xCB52
name = "XferCB52"

# Indirect-transfer hot entry (every frame via JMP ($007C)): $FA38 is
# task-8's streaming-loop interior (INY; LDX $0400,Y; ...). No static refs
# (data-driven pointer); without a record every dispatch misses. Rooted so
# dispatch hits exactly (overlaps NmiTask8's walk — same bytes, entry label
# added for the record).

[[function]]
addr = 0xFA38
name = "Task8Loop"

# NMI task vector table at $F99F (10 entries, dispatched via
# LDA $F9A0,X / LDA $F99F,X + PHA/PHA/RTS). The table stores `target-1`
# (the classic 6502 RTS-dispatch idiom: RTS pops the pushed word and then
# increments PC), so the root must be the EFFECTIVE entry `word+1`, not the
# raw word. Rooting the raw word put no dispatch-table record at the address
# the runtime requests; rt_banked_tail_dispatch then took its misaligned-
# return realignment path and jumped to the NEXT lifted boundary, so a
# type-4 palette flush ran task 5's body instead. Byte-verified: every raw
# word is the high byte of the preceding `JMP $F8BD` (or the last table
# byte), and `word+1` is the first real instruction (INY / LDA / JSR).
# Table ends at task 9 ($FA57 -> $FA58); task 10+ decode as garbage.

[[function]]
addr = 0xF8BD
name = "NmiTask0"

[[function]]
addr = 0xF9B3
name = "NmiTask1"

[[function]]
addr = 0xF9B7
name = "NmiTask2"

[[function]]
addr = 0xF9C1
name = "NmiTask3"

[[function]]
addr = 0xF9C9
name = "NmiTask4"

[[function]]
addr = 0xF9F2
name = "NmiTask5"

[[function]]
addr = 0xF9FF
name = "NmiTask6"

[[function]]
addr = 0xFA18
name = "NmiTask7"

[[function]]
addr = 0xFA58
name = "NmiTask9"

# Title->game transition WRAM-code path hits three overlapping-code entry
# points in the fixed 16K window ($C000-$FFFF, bank 30/31) that the walker
# cannot materialize on its own. Each is a 6502 "instruction-interior"
# branch/JSR target that reuses the tail bytes of a preceding instruction:
#
#  func_D22F ($D22F):  $D239 BEQ $D23E -> $D23E = tail of
#      $D23D BIT $11A5 (bytes A5 11) = LDA $11 (skip the LDA $13 arm).
#  func_D617 ($D617):  $D623 BEQ $D628 -> $D628 = tail of
#      $D627 BIT $11A5 = LDA $11 (same idiom).
#  func_E093 ($E093):  JSR $E09C -> $E09C = LDY $69; LDA $36, sharing its
#      STA ($6A),Y; RTS tail with the $E099 BEQ $E0A0 path.
#
# Without roots these stay unresolved (dispatch id $0C/$0D/$0E) and their
# stubs are placed in a different slot than the referencing bank, so the
# absolute `jp z,L_XXXX` wild-jumps into the middle of a push helper and
# executes an IX prefix (0xFD) instead of trapping cleanly. Rooted as entry
# labels only (same bytes, overlap the enclosing walk) — see XferC9C7 below.

[[function]]
addr = 0xD23E
name = "FuncD23E"

[[function]]
addr = 0xD628
name = "FuncD628"

[[function]]
addr = 0xE09C
name = "FuncE09C"

# Prologue-printer tail cluster, fixed bank 31 ($E000-$FFFF): the 30f-tap
# overworld route (route_4f.txt as FD_PAD_RAW + FD_PAUSE_START=1,
# FD_PAUSE_AT=1100,1850,2150,2450,2750,3050) first diverges at frame 5461
# ($0031/$0032/$0036/$003E/$0069) because the reference executes this
# cluster and the subject cannot: none of $E745-$E820 (except $E739-$E744)
# has any static JSR/JMP referent in the 256 KiB PRG (whole-image scan;
# the only cross-refs are bank19->{E72A,E739,E785,E78D} and bank31-internal
# ones), so the analyzer never lifts it and the subject's JMP ($007C)
# transfer targeting it misses. Reference evidence (FD_TRACE_PC, same
# route): frame=5461/5470 bank=31 pc=$E804 (A=$00 X=$00 Y=$06),
# pc=$E7FE (A=$FD: JSR $E6F2 returns carry-set, immediate RTS), pc=$E812
# (A=$46 X=$04 Y=$1B via the $E765 block; A=$30/$86 X=$00 Y=$0F via the
# $E778 block). Miss proof: the subject visibly executes $ED49 instead --
# the next lifted fixed boundary >= any cluster entry (page-E7 table holds
# only $E739): ROM $EDD6-$EDDF = 05 EE 45 EE 05 EE 7E EE 00 00 lands
# byte-identical in subject $0540-$0548 at frame 5477, plus $7C->$0040-43
# ($ED64) and $80->$07EF ($ED5F) -- the _btd_miss silent-realignment
# pattern from the $C9F9->$CA19 precedent, not a trap (fail-open realign
# for fixed targets). All five entries are clean routine starts
# (byte-verified below); the walks from them are closed (JSR callees
# $E725/$E72A/$E785/$E817/$E821/$E82A/$E67F/$E6F2 all end RTS; data reads
# $ED41/$7600 touch ROM/RAM only). No bank numbers: fixed window.
# $E745 = 20 25 E7 (JSR $E725).
# $E75C = A0 1B (LDY #$1B).
# $E765 = A0 15 (LDY #$15).
# $E778 = 20 39 E7 (JSR $E739).
# $E7FE = 20 F2 E6 (JSR $E6F2).

[[function]]
addr = 0xE745
name = "PrologueE745"

[[function]]
addr = 0xE75C
name = "PrologueE75C"

[[function]]
addr = 0xE765
name = "PrologueE765"

[[function]]
addr = 0xE778
name = "PrologueE778"

[[function]]
addr = 0xE7FE
name = "PrologueE7FE"

