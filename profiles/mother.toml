# NOTE: subject-side overworld re-validation (8aa3175 (zp),Y window
# routing) is BLOCKED, not by a seedable trap, but by WRAM code execution.
# Trap $E1 unresolved_id=$0002 at frame ~1104: NES $951A (bank 20) does
# JSR $6047 -> WRAM ($6000-$7FFF). FD_TRACE_PC confirms the reference
# executes bank=255 (RAM) at $6000/$6047/$6052/$605D (frames 1105-1121).
# Mother copies a STATIC 3KB code+data blob (10 entry points: $6000,
# $6047, $6052, $605D, $62AD, $62D8, $62ED, $6303, $631D, $6332) from CHR
# ROM offset $1E800 into WRAM $6000-$6BFF at the title->game transition,
# then executes it. The engine classifies $6000-$7FFF as PRG-RAM (data)
# and has no AnalysisWindow there, so every JSR into $6000-$7FFF emits an
# unresolved stub. This is an escalation (WRAM-execution support), not a
# bank_entry/bank_call fix. Static (frame 1200 == 2000), so a static
# WRAM-code feature (not full dynamic translation) is the fix; est 4-5
# days engine work. Scoped workaround (hand-written Z80 replacements for
# the 10 WRAM routines) is possible but game-specific and fragile.
# Addendum (re-verified at ec7b8b3, current runtime): the blob is
# byte-identical to CHR offset $1E800 (SRAM dump $6000-$6BFF == CHR
# bytes). The copy is IRQ-driven PPU reads (bank31 $CEE8/$FFD0 maps CHR
# bank $7A via MMC3 R1, copies 64B pages into $0404, then to WRAM), so
# it implicates the phase-4 CHR live path - BUT the blob is static, so a
# static WRAM-code feature can bake it from CHR ROM at build time and
# does NOT need runtime CHR reads. A SECOND RAM-execution surface also
# exists: the NMI handler (bank31 $F98E: LDA $D7 / BEQ / JSR $00D7)
# calls a zero-page-resident callback at $00D7 when [$00D7]!=0 - yet
# another unresolved label (L_00D7, id 0) that is NOT seedable. Total
# unresolved labels: 25; 11 are RAM targets ($00D7 + 10 WRAM), 14 are
# bank-dispatch misses ($963D/$9786/$97B0/$A3F8/$A92F/$AB09/$B777/
# $B79B/$B7A4/$BC73/$BCAA/$D23E/$D628/$E09C) reachable only AFTER the
# RAM-execution blockers are cleared.
# Addendum 2 (re-derived at 9933524 from ROM byte decode + translated.asm):
# the blob is INTERLEAVED code+data, not 10 clean routines. Code blocks are
# $6000-$60AC (entries $6000/$6047/$6052/$605D + 2 internal routines) and
# $62AD-$6346 (entries $62AD/$62D8/$62ED/$6303/$631D/$6332); data sits
# between them ($60AD-$62AC) and after ($6347-$6BFF). The code is
# self-contained: its absolute addressing modes use zero-page operands only
# ($0074,$0084, $0000+Y OAM staging) plus relative branches — NO absolute
# JSR/JMP into other WRAM code. The data at $6347 is a pointer table mixing
# PRG ($8010/$8030/$8050/$8070) and WRAM ($6384/$63ab/$63b8/$7478/$74b8/
# $74f8/$7538/$7689) targets, i.e. the blob also feeds INDIRECT dispatch
# into more WRAM-resident code/data beyond the 10 direct entries, so a
# static-code-region fix must discover through these tables, not just seed
# 10 JSRs. The DATA half is already done: ~100 absolute $6000-$6BFF refs (grep count) in
# PRG code lower to SMS EXRAM (lower.rs indirect_ptr_sms maps $6000-$7FFF
# -> numerically-identical EXRAM address); only blob POPULATION (build-time
